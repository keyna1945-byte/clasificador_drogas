{% extends 'base.html' %}
{% block title %}Ingreso LIBIM{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block chrome %}{% endblock %}

{% block content %}
<section class="panel auth-card mx-auto">
    <img class="auth-logo" src="{{ url_for('static', filename='img/libim-logo.jpg') }}" alt="LIBIM - Laboratorio de Investigaciones Bioquimicas">
    <div class="auth-heading">
        <p class="eyebrow">Clasificador de sustancias</p>
        <h1>Acceso laboratorio</h1>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label" for="usuario">Usuario</label>
            <input class="form-control" id="usuario" name="usuario" type="text" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Contrasena</label>
            <input class="form-control" id="password" name="password" type="password" required>
        </div>

        <div class="toolbar mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
            <a class="btn btn-ghost" href="{{ url_for('registro') }}">Crear usuario</a>
        </div>

        <p class="text-muted mb-0 mt-3">Primer acceso: admin / admin123</p>
    </form>
</section>
{% endblock %}
