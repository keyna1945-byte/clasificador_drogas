<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        form {
            width: min(420px, calc(100vw - 32px));
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 22px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 14px;
            color: #aaa;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button, a {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #00bfff;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .mensaje {
            color: #00ffcc;
        }
    </style>
</head>
<body>
    <form method="POST">
        <h1>Acceso laboratorio</h1>

        {% with mensajes = get_flashed_messages() %}
          {% if mensajes %}
            <div class="mensaje">
              {% for msg in mensajes %}
                <p>{{ msg }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" required autofocus>

        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Ingresar</button>
        <a href="{{ url_for('registro') }}">Crear usuario</a>

        <p class="mensaje">Primer acceso: admin / admin123</p>
    </form>
</body>
</html>
