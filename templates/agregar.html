{% extends 'base.html' %}
{% block title %}Agregar Sustancia{% endblock %}

{% block content %}
<section class="page-heading">
  <div>
    <p class="eyebrow">Nueva sustancia</p>
    <h1>Agregar al inventario</h1>
    <p>Carga los datos principales para clasificar y ubicar la sustancia en el laboratorio.</p>
  </div>
</section>

<section class="panel">
  <div class="panel-body">
    <form method="POST" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Numero</label>
        <input type="number" name="numero" class="form-control" required>
      </div>
      <div class="col-md-8">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Peligros</label>
        <input type="text" name="peligros" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Cancerigeno</label>
        <input type="text" name="cancerigeno" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Cantidad disponible</label>
        <input type="text" name="cantidad" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Ubicacion</label>
        <input type="text" name="ubicacion" class="form-control">
      </div>
      <div class="col-12 toolbar mt-4">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
        <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
